name = "kept-sync"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# This public repository holds *only ciphertext* on runtime-state; see README privacy notes.
GITHUB_REPO = "vudh1/kept"
GITHUB_BRANCH = "runtime-state"
# Set ALLOWED_ORIGIN to the exact PWA origin (without path), for example:
ALLOWED_ORIGIN = "https://vudh1.github.io"
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "llama-3.3-70b-versatile"

# Configure these with wrangler secret put, NEVER in this file:
# GITHUB_TOKEN, KEPT_INITIAL_PIN, KEPT_PIN_PEPPER, GEMINI_API_KEY (optional), GROQ_API_KEY (optional)

# SQLite Durable Object is available on Cloudflare Workers Free.
[[durable_objects.bindings]]
name = "HOUSEHOLD_AUTH"
class_name = "HouseholdAccess"

[exports.HouseholdAccess]
type = "durable-object"
storage = "sqlite"
