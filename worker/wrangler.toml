name = "kept-sync"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
GITHUB_REPO = "vudh1/kept"
GITHUB_BRANCH = "household-state"
# Set ALLOWED_ORIGIN to the exact PWA origin (without path), for example:
ALLOWED_ORIGIN = "https://vudh1.github.io"
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "llama-3.3-70b-versatile"

# Configure these with wrangler secret put, NEVER in this file:
# GITHUB_TOKEN, SYNC_TOKEN, GEMINI_API_KEY (optional), GROQ_API_KEY (optional)
