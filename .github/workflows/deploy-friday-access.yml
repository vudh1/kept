name: Kept FRIDAY Access (retired — cardless decision)

# Do not automatically enroll in a card-required Zero Trust plan.
# This workflow preserves the historical route while preventing cloud writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain stopped Access enrollment
        run: |
          echo "FRIDAY cardless policy: Cloudflare Zero Trust onboarding requires payment information."
          echo "No Access app, billing plan, Worker, or household feed will be changed here."
          echo "See https://github.com/vudh1/friday/issues/13 for the reviewed no-card identity replacement."
          exit 1
