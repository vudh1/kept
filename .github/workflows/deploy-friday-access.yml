name: Protect isolated Kept FRIDAY administrators with Access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-friday-access.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kept-friday-access-production
  cancel-in-progress: false

jobs:
  deploy-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate code and tests
        run: npm run check
      - name: Validate exact private administrator allowlist
        run: node scripts/provision-friday-access.mjs --validate-only
        env:
          ADMIN_EMAILS: ${{ secrets.KEPT_FRIDAY_ADMIN_EMAILS }}
      - name: Deploy separate fail-closed administrator Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/friday-admin
          secrets: |
            ADMIN_EMAILS
        env:
          ADMIN_EMAILS: ${{ secrets.KEPT_FRIDAY_ADMIN_EMAILS }}
      - name: Require named-email Cloudflare Access policy
        run: node scripts/provision-friday-access.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.KEPT_FRIDAY_ACCESS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_EMAILS: ${{ secrets.KEPT_FRIDAY_ADMIN_EMAILS }}
